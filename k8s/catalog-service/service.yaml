apiVersion: v1
kind: Service
metadata:
  name: movie-catalog-service
  namespace: cine-system
  labels:
    app: movie-catalog-service
    component: catalog
    # Este label es referenciado por el ServiceMonitor para el scraping de Prometheus
    monitoring: "true"
spec:
  type: NodePort
  selector:
    app: movie-catalog-service
  ports:
    # El nombre del puerto DEBE ser "http" para que el ServiceMonitor lo referencie
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
      nodePort: 30081
