apiVersion: v1
kind: Service
metadata:
  name: ticketing-service
  namespace: cine-system
  labels:
    app: ticketing-service
    component: ticketing
    # Este label es referenciado por el ServiceMonitor
    monitoring: "true"
spec:
  type: NodePort
  selector:
    app: ticketing-service
  ports:
    # El nombre del puerto DEBE ser "http" para que el ServiceMonitor lo referencie
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
      nodePort: 30082
